name: Radio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP and shell checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-curl php-xml
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in scripts/*.sh commands/*.sh; do bash -n "$f"; done
          node --check js/radio.js
          php tests/run.php
          python3 -m json.tool pluginInfo.json >/dev/null
          python3 -m json.tool commands/descriptions.json >/dev/null
      - name: Browser checks
        run: |
          npm install --prefix /tmp/radio-ci --no-save playwright@1.62.1
          /tmp/radio-ci/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/radio-ci/node_modules UI_SCREENSHOT_DIR=/tmp/radio-ui node tests/ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-ui-screenshots
          path: /tmp/radio-ui/
          if-no-files-found: ignore
