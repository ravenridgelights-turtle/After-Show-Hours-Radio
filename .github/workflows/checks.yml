name: Radio checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP and shell checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-curl php-xml mpd
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in scripts/*.sh commands/*.sh; do bash -n "$f"; done
          node --check assets/radio-app.js
          node --check assets/status.js
          php tests/run.php
          php tests/directories.php
          php tests/real-mpd.php /usr/bin/mpd
          python3 -m json.tool pluginInfo.json >/dev/null
          python3 -m json.tool commands/descriptions.json >/dev/null
      - name: Browser checks
        run: |
          npm install --prefix /tmp/radio-ci --no-save playwright@1.62.1
          /tmp/radio-ci/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/radio-ci/node_modules UI_SCREENSHOT_DIR=/tmp/radio-ui node tests/ui-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radio-ui-screenshots
          path: /tmp/radio-ui/
          if-no-files-found: ignore
  release:
    needs: radio
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated release with install and usage guide
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version');
            const tag = `v${version}`;
            const body = fs.readFileSync(`docs/releases/${tag}.md`, 'utf8');
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({...repo, tag});
              core.info(`${tag} is already published; bump VERSION for a new release.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const result = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: `After Show Hours Radio ${version}`, body,
                draft: false, prerelease: false, make_latest: 'true'
              });
              core.info(`Published ${result.data.html_url}`);
            }
